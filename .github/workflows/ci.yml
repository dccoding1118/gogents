name: ci

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # .golangci.yaml is v2 schema, which needs golangci-lint v2 (action v8).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -cover ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The go.mod directive stays 1.23 (language floor); the scan runs on a
      # patched toolchain so the standard library it reports is current. 1.23 is
      # EOL and never receives these stdlib fixes.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
